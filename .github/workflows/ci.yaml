name: Vue Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -----------------------------------------------
  # JOB 1 — OWASP zap : analyse faille de sécurité
  # -----------------------------------------------
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 1. installation
        run: npm ci

      - name: 2. run test
        run: npm run test

      - name: 3. build
        run: npm run build
  # -----------------------------------------------
  # JOB 2 — Snyk : vulnérabilités des dépendances
  # -----------------------------------------------
  snyk:
    name: Snyk – Dépendances npm
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Authentification Snyk
        uses: snyk/actions/setup@master

      - name: Snyk – Test des dépendances
        run: snyk test --severity-threshold=high --json > snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload rapport Snyk
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

      - name: Snyk – Bloquer si critique ou élevé
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

          