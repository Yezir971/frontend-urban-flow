name: Vue Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: ./app

jobs:
  # -----------------------------------------------
  # JOB 1 — Tests et Build
  # -----------------------------------------------
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: 1. Installation
        run: npm ci

      - name: 2. Run Tests
        run: npm run test

      - name: 3. Build
        run: npm run build

  # -----------------------------------------------
  # JOB 2 — Snyk : vulnérabilités des dépendances
  # -----------------------------------------------
  snyk:
    name: Snyk – Dépendances npm
    runs-on: ubuntu-latest
    needs: test-and-build
    defaults:
      run:
        working-directory: ./app  # ← manquait dans votre version
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Installer les dépendances
        run: npm ci

      - name: Authentification Snyk
        uses: snyk/actions/setup@master

      - name: Snyk – Test des dépendances (Génération rapport)
        run: snyk test --file=package.json --severity-threshold=high --json > snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload rapport Snyk
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: app/snyk-report.json

      - name: Snyk – Bloquer si critique ou élevé
        run: snyk test --file=package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}