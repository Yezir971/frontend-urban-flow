name: Vue Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -----------------------------------------------
  # JOB 1 — OWASP zap : analyse faille de sécurité
  # -----------------------------------------------
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: 1. installation
        run: npm ci

      - name: 2. run test
        run: npm run test

      - name: 3. build
        run: npm run build
  # -----------------------------------------------
  # JOB 2 — Snyk : vulnérabilités des dépendances
  # -----------------------------------------------
  snyk:
    name: Snyk – Dépendances npm
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './package-lock.json'

      - name: Installer les dépendances
        run: npm ci

      - name: Authentification Snyk
        uses: snyk/actions/setup@master

      - name: Snyk – Test des dépendances
        run: snyk test --severity-threshold=high --json > snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload rapport Snyk
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

      - name: Snyk – Bloquer si critique ou élevé
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

          
  # -----------------------------------------------
  # JOB 4 — SonarQube / SonarCloud (Qualité & 70% Couverture)
  # -----------------------------------------------
  sonarqube:
    name: SonarQube Quality Check
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov  

      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=yezir971
            -Dsonar.projectKey=back-urban-flow
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
          